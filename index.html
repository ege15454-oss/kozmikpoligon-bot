<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KozmikPoligon Bot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<style>
:root{--bg:#0e0b1a;--panel:#1a1530;--me:#7c5cff;--bot:#262045;--tx:#f2efff;--mut:#9d96c4;--acc:#35e0c2;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f2ff;--panel:#fff;--bot:#e8e4fb;--tx:#1b1736;--mut:#5d567f;--acc:#0a8f78;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 Sora,system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:640px;height:100%;display:flex;flex-direction:column}
header{padding:20px 20px 12px}
h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--mut);font-size:.9rem}
#log{flex:1;overflow-y:auto;padding:8px 20px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:18px;white-space:pre-line;word-wrap:break-word}
.bot{background:var(--bot);border-bottom-left-radius:4px;align-self:flex-start}
.me{background:var(--me);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.dots{color:var(--mut)}
#chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 20px}
#chips button{background:none;border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
form{display:flex;gap:8px;padding:12px 20px 16px;background:var(--panel)}
input{flex:1;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--mut);border-radius:12px;padding:12px;font:inherit}
form button{background:var(--acc);color:#0e0b1a;border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<header><h1>KozmikPoligon Bot</h1><p>Kanal, oyunlar ve destek hakkında sor.</p></header>
<div id="log" aria-live="polite"></div>
<div id="chips"></div>
<form id="f"><input id="q" placeholder="Bir şey yaz…" autocomplete="off" aria-label="Mesajın"><button>Gönder</button></form>
</main>
<script>
const KB=[
{k:["merhaba","selam","hey","slm"],a:"Merhaba! KozmikPoligon YT botuyum. Kanal, VRChat, videolar ya da destek hakkında sorabilirsin."},
{k:["kanal","hakkında","kimsin","nedir"],a:"KozmikPoligon YT, oyun ve VRChat içerikleri olan eğlenceli bir YouTube kanalı. Kaos, komik anlar ve yeni dünyalar var."},
{k:["vrchat","vr"],a:"VRChat maceraları kanalın en büyük parçası: dünyaları geziyor, insanlarla tanışıyor ve komik anlar yaşıyoruz."},
{k:["oyun","oyunlar"],a:"VRChat dışında farklı oyunlardan da eğlenceli videolar çekiyoruz."},
{k:["video","yeni","ne zaman","yayın"],a:"Düzenli olarak yeni videolar geliyor. Kaçırmamak için abone ol ve zil simgesine bas."},
{k:["abone","takip"],a:"Kanala abone olup 🔔 zilini açarsan yeni videolardan ilk sen haberdar olursun."},
{k:["destek","iletişim","yardım","ulaş","işbirliği","iş birliği"],a:"Soru, öneri ve iş birliği için kozmikpoligonytsupport hesabından bize ulaşabilirsin."},
{k:["teşekkür","sağol","eyvallah"],a:"Rica ederim! Kozmik Poligon'da görüşürüz 🚀"}];
const CH=["Kanal ne hakkında?","VRChat","Yeni video ne zaman?","Destek"];
const log=document.getElementById("log"),chips=document.getElementById("chips");
const norm=s=>s.toLocaleLowerCase("tr");
function add(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function reply(t){const n=norm(t);const hit=KB.find(e=>e.k.some(w=>n.includes(w)));
 return hit?hit.a:"Bunu tam anlayamadım. Kanal, VRChat, videolar ya da destek hakkında sorabilirsin."}
function askLocal(t){if(!t.trim())return;add(t,"me");const d=add("…","bot dots");setTimeout(()=>{d.className="m bot";d.textContent=reply(t);log.scrollTop=log.scrollHeight},500)}
const WAIT=["ne zaman","yeni video"];
async function ask(t){
 if(!t.trim())return;
 const n=norm(t);
 if(!WAIT.some(w=>n.includes(w))){askLocal(t);return}
 add(t,"me");
 const d=add("Sahibine sordum, cevap gelince burada görünecek…","bot");
 try{
  const r=await fetch("/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q:t})});
  if(!r.ok)throw 0;
  poll((await r.json()).id,d,0);
 }catch(e){d.textContent="Şu an sahibine ulaşamadım. Daha sonra tekrar dene."}
}
function poll(id,d,i){
 setTimeout(async()=>{
  try{
   const r=await(await fetch("/answer/"+id)).json();
   if(r.answer){d.textContent="Sahibinden cevap: "+r.answer;log.scrollTop=log.scrollHeight;return}
  }catch(e){}
  if(i<150)poll(id,d,i+1);else d.textContent="Henüz cevap gelmedi. Biraz sonra tekrar sor.";
 },4000);
}
CH.forEach(c=>{const b=document.createElement("button");b.type="button";b.textContent=c;b.onclick=()=>ask(c);chips.appendChild(b)});
document.getElementById("f").onsubmit=e=>{e.preventDefault();const i=document.getElementById("q");ask(i.value);i.value=""};
add(KB[0].a,"bot");
</script>
</body>
</html>
